map "$host:$http_cf_ipcountry" $miu2d_suggest_domestic {
    default false;
    "miu2d.com:CN" true;
}

map "$request_method:$http_authorization" $public_cache_request {
    default 0;
    "GET:" 1;
    "HEAD:" 1;
}

# Only anonymous object reads are public; bucket listings and signed requests are not.
map $request_uri $s3_public_object {
    default 0;
    ~^/s3/[^/?]+/[^?]+(?:\?v=[^&]+)?$ 1;
}

map "$public_cache_request:$s3_public_object:$status" $s3_cache_control {
    default "private, no-store";
    ~^1:1:(200|206|304)$ "public, max-age=300, s-maxage=3600";
}

map "$public_cache_request:$status" $resource_cache_control {
    default "private, no-store";
    ~^1:(200|206|304)$ "public, max-age=0, s-maxage=300, must-revalidate";
}

map "$public_cache_request:$status" $page_cache_control {
    default "private, no-store";
    ~^1:(200|206|304)$ "public, max-age=0, s-maxage=60, must-revalidate";
}

map "$public_cache_request:$status" $static_cache_control {
    default "private, no-store";
    ~^1:(200|206|304)$ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;

    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;
    gzip_min_length 1000;

    # CF 的地区信息每次请求不同，不能缓存或放入共享 HTML。
    location = /site-region {
        default_type application/json;
        add_header Cache-Control "private, no-store" always;
        return 200 '{"suggestDomestic":$miu2d_suggest_domestic}';
    }

    # API 必须先于静态资源规则匹配，包含 .jpg 等后缀也不能缓存。
    location ~ ^/game/[^/]+/api/ {
        set $upstream http://server:4000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
    }

    # 公开游戏资源允许 CDN 缓存 5 分钟；浏览器重验证，支持编辑后更新。
    location ~ ^/game/[^/]+/resources/ {
        set $upstream http://server:4000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $resource_cache_control always;
    }

    location = /health {
        set $upstream http://server:4000;
        proxy_pass $upstream;
        add_header Cache-Control "no-store" always;
    }

    # S3/MinIO 代理（^~ 确保优先于静态资源正则，否则 .jpg 会被缓存规则拦截）
    location ^~ /s3/ {
        set $upstream http://minio:9000;
        rewrite ^/s3/(.*) /$1 break;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        # S3_PUBLIC_ENDPOINT=/s3 signs against S3_ENDPOINT=http://minio:9000.
        proxy_set_header Host minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 公开对象可缓存；签名请求、目录列表和错误响应始终回源。
        proxy_hide_header Cache-Control;
        add_header Cache-Control $s3_cache_control always;
    }

    location = /version.json {
        add_header Cache-Control "no-store" always;
    }

    # Service Worker 不能缓存，否则浏览器检测不到新版本
    location ~* (^/sw\.js$|^/workbox-[^/]+\.js$) {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm)$ {
        add_header Cache-Control $static_cache_control always;
    }

    # tRPC API 代理
    location ^~ /trpc {
        set $upstream http://server:4000;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store" always;
    }

    # SPA 路由 - 所有其他请求返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control $page_cache_control always;
    }
}
