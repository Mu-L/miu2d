name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'luckyyyyy/miu2d' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, production]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy
        run: |
          if "$MIU2D_DEPLOY_COMMAND"; then
            echo 'Deployment completed.'
          else
            echo 'Deployment failed. Details are available to the server administrator.'
            exit 1
          fi
